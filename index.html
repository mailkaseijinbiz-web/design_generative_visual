/* 収集画像の取り込み：自動推定でコーパスに乗せる */
function addImagesToCorpus(files){
  const id = state.preset || "chair", list = corpusOf(id);
  let done = 0, total = files.length;
  [...files].forEach(f => {
    if (!f.type.startsWith("image/")) { total--; return; }
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 420 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.naturalWidth * k));
      c.height = Math.max(1, Math.round(img.naturalHeight * k));
      const cg = c.getContext("2d", { willReadFrequently:true });
      cg.drawImage(img, 0, 0, c.width, c.height);
      const est = estimate(cg.getImageData(0, 0, c.width, c.height).data, c.width, c.height);
      const p = {}; AXES.forEach(a => p[a.key] = est[a.key]);
      list.push({ cat:"収集画像", ci:6, name:f.name, p, src:"画像推定" });
      URL.revokeObjectURL(img.src);
      if (++done >= total){ drawMap(); drawCatTable(); drawAdvice(); }
    };
    img.src = URL.createObjectURL(f);
  });
}

/* ============================================================
   ② コンセプト ─ どの項目を伸ばすか
   score = 用途文脈での重要度 × 市場の空き × 伸びしろ
   ============================================================ */
function adviceList(){
  const id = state.preset || "chair", items = visibleCorpus(), ctx = CONTEXT[id] || CONTEXT.chair;
  const n = Math.max(1, items.length);
  return AXES.map(a => {
    const k = a.key, imp = ctx.w[k] ?? .5, cur = state.now[k];
    const target = Math.min(5, cur + 1);
    // その軸を実際に評価できている競合だけを母数にする
    const rated = items.filter(it => !it.measured || it.measured.includes(k));
    const known = rated.length > 0;
    const share = known ? rated.filter(it => it.p[k] >= target).length / rated.length : 0;
    const space = known ? 1 - share : .5;                            // 未測定は中立
    const room = (5 - cur) / 4;
    const banned = !!(ctx.taboo || {})[k];
    const score = banned ? 0 : imp * (.35 + .65 * space) * room;
    const step = Math.max(0, Math.min(5 - cur, Math.round(score * 5)));
    return { a, key:k, imp, space, room, score, step, banned, known, rated:rated.length,
             reason:(ctx.taboo || {})[k] || "" };
  }).sort((x, y) => y.score - x.score);
}

function drawAdvice(){
  const list = adviceList(), top = list.filter(r => !r.banned && r.step > 0).slice(0, 3);
  const bans = list.filter(r => r.banned);
  const box = $("advice");
  const fac = (label, v) => `<span>${label}<u><i style="width:${Math.round(v * 100)}%"></i></u>${(v * 100).toFixed(0)}</span>`;
  box.innerHTML = top.map((r, i) => `
    <div class="card" data-key="${r.key}">
      <div class="card-top">
        <span class="rank">${i + 1}</span>
        <strong>${r.a.name}</strong>
        <span class="move">${state.now[r.key]} → ${state.now[r.key] + r.step}</span>
        <button class="btn mini" data-adopt="${r.key}">目標に採用</button>
      </div>
      <p>${r.step > 0 ? (r.a.bUp || r.a.up) : "現状維持"}</p>
      <div class="factors">${fac("重要度", r.imp)}${r.known ? fac("市場の空き", r.space)
        : `<span>市場の空き<u><i style="width:50%;background:var(--line)"></i></u>未測定</span>`}${fac("伸びしろ", r.room)}</div>
    </div>`).join("")
    + bans.map(r => `
    <div class="card warn">
      <div class="card-top"><span class="rank">禁</span><strong>${r.a.name}</strong>
      <span class="move" style="color:var(--neg)">上げない</span></div>
      <p>${r.reason}</p>
    </div>`).join("")
    + (top.length ? "" : `<p class="empty">現状プロファイルが高く、市場の空きも小さいため、伸ばすべき項目がありません。現状を評価し直すか、対象を変えてください。</p>`);

  box.querySelectorAll("[data-adopt]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.adopt, r = list.find(x => x.key === k);
    state.goal[k] = Math.min(5, state.now[k] + r.step);
    drawAll();
  }));

  const id = state.preset || "chair";
  const p = PRESETS.find(x => x.id === id);
  $("concept-cap").textContent = p ? p.context : "─";
  state.advice = list;

  const items = visibleCorpus();
  const dense = {};
  items.forEach(it => dense[it.cat] = (dense[it.cat] || 0) + 1);
  const crowd = Object.entries(dense).sort((a2, b2) => b2[1] - a2[1])[0];
  const L = [];
  L.push(`■ コンセプト ─ ${p ? p.name : "対象"}（${p ? p.context : ""}）`);
  L.push(`市場：${items.length}件。最も混んでいるのは「${crowd ? crowd[0] : "─"}」（${crowd ? crowd[1] : 0}件）。`);
  L.push("");
  L.push("【伸ばす】");
  top.forEach((r, i) => L.push(`${i + 1}. ${r.a.name}　${state.now[r.key]}→${state.now[r.key] + r.step}　${r.a.bUp || r.a.up}`));
  if (bans.length){
    L.push("");
    L.push("【上げない】");
    bans.forEach(r => L.push(`・${r.a.name}：${r.reason}`));
  }
  L.push("");
  L.push("【一文】");
  L.push(top.length
    ? `${p ? p.name : "対象"}を、${top.map(r => r.a.name).join("と")}で差別化する。${bans.length ? `ただし${bans.map(r => r.a.name).join("・")}は上げない。` : ""}`
    : "現状を維持する。");
  $("concept-text").value = L.join("\n");
}

/* ============================================================
   ③ 可視化 ─ Canvas 2D 上の簡易3Dレンダラ
   9項目の目標値が、そのまま形状・素材・光になる。
   2Dの画素演算では届かなかったフィット性・新しい組み合わせ・機能性が、
   ここでは実際の形として動く。
   ============================================================ */
const MAT = {
  wood:"#8A5A32", fabric:"#33505A", metal:"#B4BABD", steel:"#8A9296", dark:"#33383C",
  glass:"#5F8494", resin:"#E8A61F", white:"#E4E7E8", accent:"#C4553A", rubber:"#26292C"
};
const hex2rgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];

function shiftRGB(c, o){
  let [r, g, b] = c;
  const lum = .2126*r + .7152*g + .0722*b;
  if (o.sat != null){ r = lum + (r-lum)*o.sat; g = lum + (g-lum)*o.sat; b = lum + (b-lum)*o.sat; }
  if (o.warm){ r += o.warm; b -= o.warm; g += o.warm*.3; }
  if (o.hue){ // 180度回転（意外性）
    r = lum*2 - r; g = lum*2 - g; b = lum*2 - b;
  }
  if (o.mul){ r *= o.mul; g *= o.mul; b *= o.mul; }
  return [clamp255(r), clamp255(g), clamp255(b)];
}

/* ── 面の生成 ── */
const rotP = (p, r) => {
  if (!r) return p;
  let [x, y, z] = p;
  if (r[2]){ const c = Math.cos(r[2]), s = Math.sin(r[2]); [x, y] = [x*c - y*s, x*s + y*c]; }
  if (r[0]){ const c = Math.cos(r[0]), s = Math.sin(r[0]); [y, z] = [y*c - z*s, y*s + z*c]; }
  if (r[1]){ const c = Math.cos(r[1]), s = Math.sin(r[1]); [x, z] = [x*c + z*s, -x*s + z*c]; }
  return [x, y, z];
};
const at = (c, p, r) => { const q = rotP(p, r); return [c[0]+q[0], c[1]+q[1], c[2]+q[2]]; };

function box(F, c, s, color, role, r){
  const [w, h, d] = s, X = w/2, Y = h/2, Z = d/2;
  const P = [[-X,-Y,-Z],[X,-Y,-Z],[X,Y,-Z],[-X,Y,-Z],[-X,-Y,Z],[X,-Y,Z],[X,Y,Z],[-X,Y,Z]].map(p => at(c, p, r));
  [[0,3,2,1],[4,5,6,7],[0,1,5,4],[3,7,6,2],[1,2,6,5],[0,4,7,3]]
    .forEach(q => F.push({ v:q.map(i => P[i]), color, role }));
}
function cyl(F, c, rad, len, seg, color, role, axis, r){
  const A = [], B = [];
  for (let i = 0; i < seg; i++){
    const t = i / seg * Math.PI * 2, x = Math.cos(t)*rad, y = Math.sin(t)*rad;
    const p = axis === "y" ? [x, -len/2, y] : axis === "x" ? [-len/2, y, x] : [x, y, -len/2];
    const q = axis === "y" ? [x,  len/2, y] : axis === "x" ? [ len/2, y, x] : [x, y,  len/2];
    A.push(at(c, p, r)); B.push(at(c, q, r));
  }
  for (let i = 0; i < seg; i++){
    const j = (i+1) % seg;
    F.push({ v:[A[i], A[j], B[j], B[i]], color, role });
  }
  F.push({ v:A.slice().reverse(), color, role });
  F.push({ v:B.slice(), color, role });
}
function ring(F, c, rIn, rOut, depth, seg, color, inner, role, r){
  const f = [], b = [];
  for (let i = 0; i < seg; i++){
    const t = i / seg * Math.PI * 2, co = Math.cos(t), si = Math.sin(t);
    f.push([at(c, [co*rIn, si*rIn, depth/2], r), at(c, [co*rOut, si*rOut, depth/2], r),
            at(c, [co*rIn, si*rIn, -depth/2], r), at(c, [co*rOut, si*rOut, -depth/2], r)]);
  }
  for (let i = 0; i < seg; i++){
    const j = (i+1) % seg;
    F.push({ v:[f[i][0], f[i][1], f[j][1], f[j][0]], color, role });          // 前面
    F.push({ v:[f[j][2], f[j][3], f[i][3], f[i][2]], color, role });          // 背面
    F.push({ v:[f[i][2], f[i][0], f[j][0], f[j][2]], color:inner, role });    // 内壁
    F.push({ v:[f[i][1], f[i][3], f[j][3], f[j][1]], color, role });          // 外壁
  }
}
/* 接触面：フィット性が上がるほど身体を受ける皿になる */
function dish(F, c, s, curv, color, role, r){
  const [w, h, d] = s, N = 5, X = w/2, Z = d/2, top = h/2;
  const sag = curv * Math.min(w, d) * .34;
  const yAt = (u, v) => top - sag * (u*u * .55 + v*v);
  for (let i = 0; i < N; i++) for (let k = 0; k < N; k++){
    const u0 = -1 + 2*i/N, u1 = -1 + 2*(i+1)/N, v0 = -1 + 2*k/N, v1 = -1 + 2*(k+1)/N;
    F.push({ v:[
      at(c, [u0*X, yAt(u0, v0), v0*Z], r), at(c, [u1*X, yAt(u1, v0), v0*Z], r),
      at(c, [u1*X, yAt(u1, v1), v1*Z], r), at(c, [u0*X, yAt(u0, v1), v1*Z], r)
    ], color, role });
  }
  box(F, [c[0], c[1] - h*.25, c[2]], [w, h*.5, d], color, role, r);
}

/* 差替素材（新しい組み合わせ）：[定石, 標準, 逸脱] を対象ごとに持つ */
const INSERT = {
  glasses:[MAT.glass, MAT.glass, MAT.wood],
  fridge :[MAT.metal, MAT.metal, MAT.wood],
  ct     :[MAT.white, MAT.glass, MAT.wood],
  robot  :[MAT.steel, MAT.steel, MAT.glass],
  bus    :[MAT.glass, MAT.glass, MAT.wood],
  chair  :[MAT.wood,  MAT.wood,  MAT.glass]
};

const MAT_NAME = { wood:"木", fabric:"布", metal:"金属", steel:"鋼", dark:"樹脂（黒）",
                   glass:"ガラス", resin:"樹脂", white:"樹脂（白）", accent:"塗装", rubber:"ゴム" };
function matName(id, combi){
  const set = INSERT[id] || INSERT.chair;
  const m = combi >= 4 ? set[2] : combi <= 2 ? set[0] : set[1];
  return (Object.entries(MAT).find(([, v]) => v === m) || ["", ""])[0]
    ? MAT_NAME[Object.entries(MAT).find(([, v]) => v === m)[0]] : "─";
}

/* ── 対象ごとの構成 ── */
function buildModel(id, P){
  const F = [], fit = (P.fit-1)/4, form = (P.form-1)/4, func = (P.func-1)/4;
  const detail = P.form <= 3;                    // 形態を単純化すると装飾部品が落ちる
  const seg = P.form >= 4 ? 8 : 16;              // 単純化＝面数も落とす
  const ctl = 1 + func * .5;                     // 機能性＝操作部が大きく明快になる
  const iset = INSERT[id] || INSERT.chair;
  const ins = P.combi >= 4 ? iset[2] : P.combi <= 2 ? iset[0] : iset[1];

  if (id === "chair"){
    dish(F, [0, .10, 0], [1.15, .16, 1.05], fit, MAT.fabric, "contact");
    box(F, [0, .72, -.48], [1.15, 1.05, .13], MAT.fabric, "contact", [fit*.22, 0, 0]);
    [[-.48,-.42],[.48,-.42],[-.48,.42],[.48,.42]].forEach(([x, z]) =>
      box(F, [x, -.36, z], [.10, .78, .10], MAT.wood, "structure"));
    box(F, [0, -.62, 0], [1.0, .07, .9], ins, "insert");
    if (detail){ [-.62, .62].forEach(x => box(F, [x, .34, -.05], [.10, .09, .62], MAT.wood, "detail")); }
  }
  else if (id === "glasses"){
    [-.66, .66].forEach(x => {
      box(F, [x, 0, 0], [.66, .50, .07], MAT.dark, "structure");
      box(F, [x, 0, .01], [.54, .38, .05], ins, "insert");
    });
    box(F, [0, .12, 0], [.66, .09, .06], MAT.dark, "structure");
    [-1, 1].forEach(s2 => {
      box(F, [s2*.95, .09, -.45], [.07, .08, .95], MAT.dark, "structure");
      box(F, [s2*.95, .01 - fit*.14, -.98], [.07, .09 + fit*.06, .30], MAT.dark, "contact", [.35 + fit*.55, 0, 0]);
      box(F, [s2*.24, -.20 - fit*.04, .05], [.045, .15, .045], MAT.metal, "contact", [0, 0, s2*(.22 + fit*.3)]);
    });
    if (detail) [-.66, .66].forEach(x => box(F, [x, .27, .02], [.60, .05, .05], MAT.metal, "detail"));
  }
  else if (id === "fridge"){
    box(F, [0, .35, 0], [1.15, 2.10, .95], MAT.steel, "structure");
    box(F, [0, .95, .50], [1.10, .86, .07], MAT.white, "panel");
    box(F, [0, -.15, .50], [1.10, 1.28, .07], MAT.white, "panel");
    [.95, -.15].forEach(y => box(F, [.42, y, .57], [.06*ctl, .52*ctl, .07*ctl], MAT.dark, "control"));
    box(F, [-.28, 1.22, .56], [.34*ctl, .16*ctl, .04], MAT.dark, "control");
    box(F, [0, -.86, 0], [1.05, .10, .85], ins, "insert");
    if (detail) box(F, [0, .40, .54], [1.06, .04, .03], MAT.metal, "detail");
  }
  else if (id === "ct"){
    ring(F, [0, .55, 0], .62, 1.30, .85, seg * 2, MAT.white, MAT.dark, "structure");
    box(F, [0, -.55, 0], [2.5, .60, .95], MAT.steel, "structure");
    dish(F, [0, .10, 1.25], [.62, .16, 1.9], fit, MAT.white, "contact");
    box(F, [0, -.38, 1.05], [.42, .70, .55], MAT.steel, "structure");
    box(F, [-.86, .70, .46], [.42*ctl, .20*ctl, .06], MAT.dark, "control");
    ring(F, [0, .55, .44], .62, .74, .06, seg * 2, ins, ins, "insert");
    if (detail) box(F, [.80, .95, .44], [.30, .08, .04], MAT.metal, "detail");
  }
  else if (id === "robot"){
    box(F, [0, -.86, 0], [1.25, .28, 1.1], MAT.dark, "structure");
    cyl(F, [0, -.58, 0], .38, .34, seg, MAT.resin, "structure", "y");
    box(F, [0, -.02, 0], [.34, 1.15, .38], MAT.resin, "structure", [0, 0, -.18]);
    box(F, [.62, .60, 0], [1.15, .28, .32], MAT.resin, "structure", [0, 0, -.22]);
    cyl(F, [0, .54, 0], .21, .46, seg, MAT.dark, "structure", "x");
    cyl(F, [1.18, .35, 0], .15, .34, seg, MAT.dark, "structure", "x");
    box(F, [1.34, .18, 0], [.20, .34, .22], MAT.metal, "structure");
    [-1, 1].forEach(s2 => box(F, [1.42, -.10, s2*.13], [.10*ctl, .34*ctl, .07*ctl], MAT.steel, "control"));
    box(F, [1.42, -.40, 0], [.34, .18, .34], ins, "insert");
    if (detail) box(F, [-.02, .10, .22], [.06, .90, .05], MAT.dark, "detail");
  }
  else if (id === "bus"){
    box(F, [0, .30, 0], [3.9, 1.35, 1.5], MAT.white, "structure");
    [.82, -.82].forEach(z => box(F, [0, .62, z], [3.6, .62, .14], ins, "insert"));
    box(F, [2.02, .55, 0], [.10, .74, 1.4], ins, "insert");
    box(F, [0, -.22, .80], [3.9, .30, .06], MAT.accent, "panel");
    [[-1.25, .84],[1.25, .84]].forEach(([x, z]) =>
      box(F, [x, .10, z], [.42*ctl, .95*ctl, .06], MAT.dark, "control"));
    // 乗降口の踏面と手すり（フィット性＝乗り降りの受け）
    dish(F, [1.25, -.44, 1.02], [.52, .12, .60], fit, MAT.metal, "contact");
    box(F, [1.02, .05, .92], [.06, .95, .06], MAT.metal, "contact", [0, 0, fit*.30]);
    [[-1.3, .76],[1.35, .76],[-1.3, -.76],[1.35, -.76]].forEach(([x, z]) =>
      cyl(F, [x, -.52, z], .38, .26, seg, MAT.rubber, "structure", "z"));
    if (detail) box(F, [0, 1.0, 0], [1.3, .12, .9], MAT.metal, "detail");
  }
  return F;
}

/* ── 描画 ── */
function render3D(){
  const cvs = $("three"), g = cvs.getContext("2d"), W = cvs.width, H = cvs.height;
  const P = Object.fromEntries(AXES.map(a => [a.key, state.goal[a.key]]));
  const id = state.preset || "chair";
  const atmos = (P.atmos - 3) / 2, colorK = (P.color - 3) / 2, matter = (P.matter - 1) / 4;
  const modern = (P.image - 3) / 2, surp = (P.surp - 3) / 2;

  // 背景と床
  const bgTop = atmos > 0 ? "#EFE6D6" : "#D5D8DA", bgBot = atmos > 0 ? "#C9B79C" : "#9DA5A9";
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, bgTop); bg.addColorStop(1, bgBot);
  g.fillStyle = bg; g.fillRect(0, 0, W, H);

  const faces = buildModel(id, P);

  // 対象ごとに寸法が違うので、画面に合わせて正規化する
  const lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
  faces.forEach(fc => fc.v.forEach(p => p.forEach((v, i) => { if (v < lo[i]) lo[i] = v; if (v > hi[i]) hi[i] = v; })));
  const size = [hi[0]-lo[0], hi[1]-lo[1], hi[2]-lo[2]];
  const k0 = 4.2 / Math.max(size[0], size[1] * 1.3, size[2]);
  const cx0 = (hi[0]+lo[0])/2, cz0 = (hi[2]+lo[2])/2, cy0 = (hi[1]+lo[1])/2;
  faces.forEach(fc => fc.v = fc.v.map(p => [(p[0]-cx0)*k0, (p[1]-cy0)*k0, (p[2]-cz0)*k0]));
  const baseY = -size[1] * k0 / 2, spanX = size[0] * k0;

  const yaw = state.yaw * Math.PI / 180, pitch = state.pitch * Math.PI / 180;
  const cy2 = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  const dist = 7.4, f = 900;
  const cam = p => {
    let [x, y, z] = p;
    [x, z] = [x*cy2 + z*sy, -x*sy + z*cy2];
    [y, z] = [y*cp - z*sp, y*sp + z*cp];
    return [x, y, z];
  };
  const proj = p => { const k = f / (dist - p[2]); return [W/2 + p[0]*k, H/2 + 24 - p[1]*k]; };

  // 接地影（モデルの底面の位置に落とす）
  const [sx, sy2] = proj(cam([0, baseY - .04, 0]));
  const sr = Math.max(60, spanX * f / dist * .58);
  const sh = g.createRadialGradient(sx, sy2, 8, sx, sy2, sr);
  sh.addColorStop(0, `rgba(40,34,28,${(.34 + (atmos < 0 ? .1 : 0)).toFixed(2)})`); sh.addColorStop(1, "rgba(40,34,28,0)");
  g.fillStyle = sh; g.beginPath(); g.ellipse(sx, sy2, sr, sr * .22, 0, 0, Math.PI*2); g.fill();

  const light = V.norm([-.45, .82, .55]);
  const ambient = .34 + (atmos > 0 ? .16*atmos : .26*atmos);
  const warm = atmos * 16;
  const spec = (1 - matter) * .55;                    // 質感が低いほどつるつる光る
  const jr = rand(881);
  const surpIdx = Math.floor(rand(id.length * 31 + 5)() * faces.length);

  const drawn = faces.map((fc, i) => {
    const vc = fc.v.map(cam);
    const n = V.norm(V.cross(V.sub(vc[1], vc[0]), V.sub(vc[2], vc[0])));
    const mid = vc.reduce((s2, p) => [s2[0]+p[0], s2[1]+p[1], s2[2]+p[2]], [0,0,0]).map(v => v/vc.length);
    return { fc, vc, n, z:mid[2], i };
  }).filter(o => o.n[2] > -.02)                       // 裏面を落とす
    .sort((a, b) => a.z - b.z);

  const strokeEdges = P.image <= 2;                   // クラシック寄りは輪郭を描く
  drawn.forEach(o => {
    const lam = Math.max(0, V.dot(o.n, light));
    const sp2 = spec * Math.pow(Math.max(0, o.n[2]), 18);
    const rough = 1 + (jr() - .5) * matter * .22;     // 質感＝面ごとの肌理
    let base = hex2rgb(o.fc.color);
    base = shiftRGB(base, { sat:1 + colorK * .75 - modern * .18, warm, hue:(surp > 0 && o.i === surpIdx) });
    const k = (ambient + (1 - ambient) * lam) * rough;
    const c = base.map((v, j) => clamp255(v * k + 255 * sp2 * (j === 2 ? 1.05 : 1)));
    const pts = o.vc.map(proj);
    g.beginPath();
    g.moveTo(pts[0][0], pts[0][1]);
    pts.slice(1).forEach(p => g.lineTo(p[0], p[1]));
    g.closePath();
    g.fillStyle = `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
    g.fill();
    if (strokeEdges){ g.strokeStyle = "rgba(40,32,26,.35)"; g.lineWidth = 1; g.stroke(); }
  });

  if (matter > .35){                                   // 粒状の肌理
    const im = g.getImageData(0, 0, W, H);
    grain(im.data, (matter - .35) * .10, 3);
    g.putImageData(im, 0, 0);
  }

  const roles = { contact:"接触面（フィット性）", insert:"差替素材（新しい組み合わせ）",
                  control:"操作部（機能性）", detail:"装飾部（形態で増減）", structure:"構造", panel:"面材" };
  const used = [...new Set(faces.map(fc => fc.role))];
  $("parts").innerHTML = used.map(r =>
    `<span><i style="background:${(faces.find(fc => fc.role === r) || {}).color}"></i>${roles[r] || r}</span>`).join("");
  $("three-badge").textContent = `${(PRESETS.find(p => p.id === id) || {}).name || "対象"}／面 ${faces.length}`;
  $("readout3d").innerHTML =
    `<span>フィット性 ${P.fit} → 接触面の皿</span><span>形態 ${P.form} → 装飾${P.form <= 3 ? "有" : "無"}／面 ${faces.length}</span>`
    + `<span>新しい組み合わせ ${P.combi} → ${matName(id, P.combi)}</span>`
    + `<span>機能性 ${P.func} → 操作部 ×${(1 + (P.func-1)/4*.5).toFixed(2)}</span>`;
}

/* ============================================================
   ④ 評価 ─ 妥当性チェックと案の記録
   ============================================================ */
function marketMean(){
  const items = visibleCorpus(), m = {};
  AXES.forEach(a => m[a.key] = items.reduce((s2, it) => s2 + it.p[a.key], 0) / Math.max(1, items.length));
  return m;
}
const profDist = (p, q) => Math.sqrt(AXES.reduce((s2, a) => s2 + (p[a.key] - q[a.key]) ** 2, 0));

function drawChecks(){
  const d = deltas(), id = state.preset || "chair", ctx = CONTEXT[id] || CONTEXT.chair;
  const moved = AXES.filter(a => d[a.key] !== 0);
  const mean = marketMean();
  const dNow = profDist(state.now, mean), dGoal = profDist(state.goal, mean);
  const ranked = Object.entries(ctx.w).sort((a, b) => b[1] - a[1]).slice(0, 2).map(e => e[0]);
  const hitTop = ranked.filter(k => d[k] > 0);
  const banned = Object.keys(ctx.taboo || {}).filter(k => d[k] > 0);
  const structural = moved.filter(a => a.engine === "brief").length;

  const rows = [
    banned.length
      ? ["ng", `禁忌項目を上げている：${banned.map(k => AX[k].name).join("・")}。${ctx.taboo[banned[0]]}`]
      : ["ok", "用途文脈で上げてはいけない項目には触れていない。"],
    hitTop.length
      ? ["ok", `この用途で重要な「${hitTop.map(k => AX[k].name).join("・")}」を伸ばしている。`]
      : ["warn", `重要度上位の「${ranked.map(k => AX[k].name).join("・")}」が動いていない。効きの弱い項目だけを触っていないか。`],
    moved.length === 0 ? ["warn", "差分がない。現状維持の案。"]
      : moved.length <= 3 ? ["ok", `動かす項目は${moved.length}件。焦点が絞れている。`]
      : ["warn", `動かす項目が${moved.length}件。多すぎると何のデザインか読めなくなる。3件までを目安に。`],
    dGoal > dNow + .3
      ? ["ok", `市場平均からの距離が ${dNow.toFixed(1)} → ${dGoal.toFixed(1)} に広がる。差別化の方向。`]
      : dGoal < dNow - .3
      ? ["warn", `市場平均に ${dNow.toFixed(1)} → ${dGoal.toFixed(1)} と近づく。埋没する方向。意図的か確認。`]
      : ["warn", `市場平均との距離がほぼ変わらない（${dNow.toFixed(1)} → ${dGoal.toFixed(1)}）。`],
    structural
      ? ["ok", `構造項目を${structural}件含む。画像処理だけで終わらない案になっている。`]
      : ["warn", "動かしているのが画像で表現できる項目だけ。見た目の調整に留まっていないか。"]
  ];
  $("checks").innerHTML = rows.map(([k, t]) =>
    `<li class="${k}"><span class="mk">${k === "ok" ? "✓" : k === "warn" ? "△" : "✕"}</span><span>${t}</span></li>`).join("");
}

function drawSaved(){
  const box = $("saved");
  if (!state.cands.length){ box.innerHTML = `<li class="empty">まだ記録がありません。</li>`; return; }
  box.innerHTML = "";
  state.cands.forEach((c, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<b>${c.title}</b><em>${c.summary}</em>`;
    const load = document.createElement("button");
    load.className = "btn mini"; load.textContent = "呼び出す";
    load.addEventListener("click", () => {
      if (c.preset && c.preset !== state.preset) usePreset(c.preset);
      state.now = { ...c.now }; state.goal = { ...c.goal };
      drawAll();
    });
    const del = document.createElement("button");
    del.className = "btn mini"; del.textContent = "削除";
    del.addEventListener("click", () => { state.cands.splice(i, 1); drawSaved(); });
    li.append(load, del);
    box.appendChild(li);
  });
}

$("btn-save").addEventListener("click", () => {
  const { w, h } = state.src;
  if (!processed) drawViewport();
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  c.getContext("2d").putImageData(new ImageData(new Uint8ClampedArray(processed), w, h), 0, 0);
  const a = document.createElement("a");
  a.download = "kansei-morph.png"; a.href = c.toDataURL("image/png"); a.click();
});

$("btn-copy").addEventListener("click", async () => {
  const btn = $("btn-copy");
  try { await navigator.clipboard.writeText($("brief").value); btn.textContent = "コピーしました"; }
  catch { $("brief").select(); btn.textContent = "選択しました。手動でコピーしてください"; }
  setTimeout(() => btn.textContent = "指示書をコピー", 1800);
});

$("btn-json").addEventListener("click", () => {
  const d = deltas();
  const payload = {
    framework: "感性デザイン9項目（山岡俊樹）",
    target: state.label,
    profile: AXES.map(a => ({
      no:a.no, name:a.name, engine:a.engine,
      now:state.now[a.key], goal:state.goal[a.key], delta:d[a.key],
      operation: d[a.key] === 0 ? null : (a.engine === "pixel" ? OPS[a.key](d[a.key]) : (d[a.key] > 0 ? a.bUp : a.bDown))
    })),
    prompt: promptLine(AXES.filter(a => d[a.key] !== 0), d)
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.download = "kansei-recipe.json"; a.href = URL.createObjectURL(blob); a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
});

/* ドラッグ＆ドロップ／貼り付け */
const dz = $("dropzone"), vp = $("viewport");
["dragenter", "dragover"].forEach(t => vp.addEventListener(t, e => { e.preventDefault(); dz.classList.add("on"); }));
["dragleave", "drop"].forEach(t => vp.addEventListener(t, e => { e.preventDefault(); dz.classList.remove("on"); }));
vp.addEventListener("drop", e => { if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });
window.addEventListener("paste", e => {
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/"));
  if (item) loadFile(item.getAsFile());
});

/* ── タブと工程の操作 ── */
document.querySelectorAll(".tab").forEach(b =>
  b.addEventListener("click", () => setTab(b.dataset.tab)));
$("vis-3d").addEventListener("click", () => setVis("3d"));
$("vis-img").addEventListener("click", () => setVis("img"));

["map-x", "map-y"].forEach(id => $(id).addEventListener("change", drawMap));
$("btn-corpus-img").addEventListener("click", () => $("corpus-file").click());
$("corpus-file").addEventListener("change", e => { addImagesToCorpus(e.target.files); e.target.value = ""; });
$("btn-corpus-json").addEventListener("click", () => {
  const id = state.preset || "chair";
  const payload = {
    target: id, axes: AXES.map(a => a.key),
    items: corpusOf(id).map(it => ({ name:it.name, category:it.cat, source:it.src, profile:it.p }))
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.download = `kansei-corpus-${id}.json`; a.href = URL.createObjectURL(blob); a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
});

$("btn-adopt-all").addEventListener("click", () => {
  (state.advice || []).filter(r => !r.banned && r.step > 0).slice(0, 3)
    .forEach(r => state.goal[r.key] = Math.min(5, state.now[r.key] + r.step));
  drawAll();
});
$("btn-copy-concept").addEventListener("click", async () => {
  const b = $("btn-copy-concept");
  try { await navigator.clipboard.writeText($("concept-text").value); b.textContent = "コピーしました"; }
  catch { $("concept-text").select(); b.textContent = "選択しました"; }
  setTimeout(() => b.textContent = "コンセプト文をコピー", 1800);
});

/* 3D の視点 */
$("yaw").addEventListener("input", e => { state.yaw = +e.target.value; render3D(); });
$("spin").addEventListener("change", e => { state.spin = e.target.checked; if (state.spin) tick(); });
let dragging = null;
const three = $("three");
three.addEventListener("pointerdown", e => {
  dragging = { x:e.clientX, y:e.clientY, yaw:state.yaw, pitch:state.pitch };
  three.setPointerCapture(e.pointerId);
});
three.addEventListener("pointermove", e => {
  if (!dragging) return;
  state.yaw = dragging.yaw + (e.clientX - dragging.x) * .4;
  state.pitch = Math.max(-45, Math.min(35, dragging.pitch - (e.clientY - dragging.y) * .3));
  $("yaw").value = Math.max(-180, Math.min(180, state.yaw));
  render3D();
});
["pointerup", "pointercancel"].forEach(t => three.addEventListener(t, () => dragging = null));
function tick(){
  if (!state.spin) return;
  state.yaw = (state.yaw + .55 + 180) % 360 - 180;
  $("yaw").value = state.yaw;
  if (state.tab === "visual" && state.vis === "3d") render3D();
  requestAnimationFrame(tick);
}

$("btn-save-cand").addEventListener("click", () => {
  const d = deltas();
  const moved = AXES.filter(a => d[a.key] !== 0);
  const p = PRESETS.find(x => x.id === state.preset);
  state.cands.push({
    title: `${p ? p.name : "案"} ${state.cands.length + 1}`,
    summary: moved.length
      ? moved.map(a => `${a.name}${d[a.key] > 0 ? "+" : "−"}${Math.abs(d[a.key])}`).join(" ")
      : "差分なし",
    preset: state.preset, now:{ ...state.now }, goal:{ ...state.goal }
  });
  drawSaved();
});

/* 起動 */
setMode("goal");
buildAxes();
buildPresets();
fillAxisSelects();
usePreset("glasses");
state.goal.color = Math.min(5, state.now.color + 1);
state.goal.matter = Math.min(5, state.now.matter + 1);
setTab("research");
</script>
